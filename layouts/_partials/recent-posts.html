<h3>{{ i18n "recentPosts" }}</h3>
<ul class="blog-posts">
  {{ range first 7 (where site.RegularPages "Section" "posts").ByDate.Reverse }}
  <li>
    <span>
    <i>
      <time datetime='{{ .Date.Format "2006-01-02" }}'>
        {{ .Date.Format (default "02 Jan, 2006" .Site.Params.dateFormat) }}
      </time>
    </i>
    </span>
    <a href="{{ .Permalink }}">{{ .Title }}</a>
  </li>
  {{ else }}
  <li>
    No posts yet
  </li>
  {{ end }}
</ul>
<small><a href="{{ "posts" | relURL }}">{{ i18n "toAllPosts" | safeHTML }}</a></small>
